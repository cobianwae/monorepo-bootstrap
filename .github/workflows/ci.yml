name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-verify:
    name: Verify Design System Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript Types
        run: pnpm build:types

      - name: Audit Token WCAG Contrast
        run: pnpm test:tokens

      - name: Run UI Component Tests
        run: pnpm --filter @ds/ui test

      - name: Build Living Documentation Showcase
        run: pnpm --filter @ds/showcase build
